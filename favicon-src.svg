<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Bluerook mark, drawn for 16px first.

    The previous version put a detailed rook on a midnight tile. Its four
    crenellations were 6 units wide on a 100-unit grid, so a browser tab
    merged them into one solid block and the rook stopped reading as a
    rook. A near-black tile also disappears against dark browser chrome.

    Three wide merlons survive the downscale, and the field is Bluerook
    blue, which keeps an edge on both light and dark tab strips. Straight
    lines only, so every size is the same shape.
  -->
  <rect width="512" height="512" rx="110" ry="110" fill="#1C3F8A"/>
  <g transform="translate(61.44 61.44) scale(3.8912)">
    <path fill="#F4EDE0" d="M 8,0 H 28 V 20 H 41 V 0 H 59 V 20 H 72 V 0 H 92
                            V 34 L 74,52 V 66 L 90,86 V 100 H 10 V 86 L 26,66
                            V 52 L 8,34 Z"/>
  </g>
</svg>
